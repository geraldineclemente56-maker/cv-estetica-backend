spring.application.name=bdd
spring.profiles.active=lab

# Capa JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway — Versionado de esquema (las migraciones viven en el repositorio)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging estructurado para consola
logging.pattern.console=%5p | %t | %c{1.} | %m%n

# Perfil "lab" — Valores provistos por el docente en clase
spring.datasource.url=jdbc:mariadb://localhost:3306/practico_bdd
spring.datasource.username=estetica
spring.datasource.password=ce123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
